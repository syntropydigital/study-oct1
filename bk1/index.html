<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Locked</title>
<style>
:root{color-scheme:light dark;--bg:#F2F3F5;--panel:#fff;--ink:#1B1F26;--ink2:#4B5563;--rule:#D5D9E0;--acc:#1F4E6B}
@media (prefers-color-scheme:dark){:root{--bg:#15181D;--panel:#1D2128;--ink:#E6E4DF;--ink2:#A5ABB6;--rule:#333944;--acc:#8CC0DE}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;
 background:var(--bg);color:var(--ink);font:16px/1.55 ui-serif,Georgia,"Times New Roman",serif}
form{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:26px;width:100%;max-width:23rem}
h1{font-size:1.15rem;margin:0 0 .3rem}
p{color:var(--ink2);font-size:.92rem;margin:0 0 1.1rem}
label{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:.35rem}
input{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--rule);border-radius:6px;
 background:var(--bg);color:var(--ink)}
input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{margin-top:.9rem;width:100%;font:inherit;padding:.6rem;border:0;border-radius:6px;
 background:var(--acc);color:#fff;cursor:pointer}
.err{color:#B3261E;font-size:.88rem;margin-top:.7rem;min-height:1.2em}
@media (prefers-color-scheme:dark){.err{color:#F2B8B5}}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Karamazov, Book One</h1>
  <p>This copy is locked. Enter the passphrase to read it.</p>
  <label for="p">Passphrase</label>
  <input id="p" name="password" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Unlock</button>
  <div class="err" id="e" role="status"></div>
</form>
